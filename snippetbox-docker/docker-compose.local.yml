services:
  snippetbox-nextjs:
    build:
      context: ../snippetbox
      dockerfile: ../snippetbox-docker/snippetbox/Dockerfile
    image: snippetbox-nextjs:local
    container_name: snippetbox
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_PATH: /data/snippetbox.db
      COOKIE_SECURE: "false"
    volumes:
      - snippetbox-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  snippetbox-data:
