services:
  snippetbox:
    build:
      context: ../snippetbox
      dockerfile: ../snippetbox-docker/snippetbox/Dockerfile
    image: snippetbox:local
    container_name: snippetbox
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - snippetbox-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  snippetbox-data:
