version: 2
updates:
  - package-ecosystem: npm
    directory: /snippetbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /snippetbox-docker/snippetbox
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(docker)"
