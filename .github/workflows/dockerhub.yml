name: Publish DockerHub

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  release:
    types: [published]

concurrency:
  group: dockerhub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish latest and sha tags
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: info
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: snippetbox
          file: snippetbox-docker/snippetbox/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/snippetbox:latest
            ${{ vars.DOCKERHUB_USERNAME }}/snippetbox:sha-${{ steps.info.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag release version
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo