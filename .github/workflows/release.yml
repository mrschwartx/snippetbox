name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

  resolve:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          prerelease=false
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            prerelease=true
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.v.outputs.tag }}
          fetch-depth: 0
      - name: Verify tag is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify package version matches tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          pkg="$(node -p "require('./snippetbox/package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then
            echo "package.json is $pkg but tag is $VERSION" >&2
            exit 1
          fi

  ci:
    needs: resolve
    uses: ./.github/workflows/_ci.yml
    with:
      ref: refs/tags/${{ needs.resolve.outputs.tag }}
    permissions:
      contents: read
      pull-requests: read

  scan:
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: snippetbox
          file: snippetbox-docker/snippetbox/Dockerfile
          platforms: linux/amd64
          load: true
          tags: snippetbox:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: snippetbox:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: [resolve, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dockerhub
    concurrency:
      group: publish-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/snippetbox
          VERSION: ${{ needs.resolve.outputs.version }}
          MAJOR: ${{ needs.resolve.outputs.major }}
          MINOR: ${{ needs.resolve.outputs.minor }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published" >&2
            exit 1
          fi
          sha="$(git rev-parse --short=7 HEAD)"
          tags="$IMAGE:$VERSION"$'\n'"$IMAGE:sha-$sha"
          if [ "$PRERELEASE" = "false" ]; then
            tags+=$'\n'"$IMAGE:$MAJOR.$MINOR"$'\n'"$IMAGE:$MAJOR"$'\n'"$IMAGE:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published images"
            echo "$tags" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        with:
          context: snippetbox
          file: snippetbox-docker/snippetbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
