name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: snippetbox-nextjs

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-nextjs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-nextjs/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f snippetbox-docker/snippetbox-nextjs/Dockerfile -t snippetbox-nextjs:ci snippetbox-nextjs
        working-directory: .
