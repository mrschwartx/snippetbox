name: SnippetBox CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: snippetbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: snippetbox quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snippetbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    defaults:
      run:
        working-directory: snippetbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            snippetbox/playwright-report
            snippetbox/test-results
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: e2e
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: snippetbox
          file: snippetbox-docker/snippetbox/Dockerfile
          load: true
          tags: snippetbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run -d --name snippetbox -p 3000:3000 snippetbox:ci
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ping | grep -q OK; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Check pages
        run: |
          for path in / /user/login /user/signup /snippet/create; do
            curl -fsS -o /dev/null "http://localhost:3000$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/snippet/view/1)" = "404"
      - name: Show logs on failure
        if: failure()
        run: docker logs snippetbox
